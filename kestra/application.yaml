# Kestra standalone configuration for BCM Node Ops Agent
# Phase 1: Standalone mode (server + worker + UI in one container)
# Phase 2: Switch to worker-only mode connecting to Kestra Server on AWS

kestra:
  repository:
    type: postgres
  storage:
    type: local
    local:
      base-path: /app/storage
  queue:
    type: postgres

datasources:
  postgres:
    url: jdbc:postgresql://kestra-db:5432/kestra
    driverClassName: org.postgresql.Driver
    username: kestra
    password: kestra
