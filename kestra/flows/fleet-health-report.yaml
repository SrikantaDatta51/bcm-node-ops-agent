id: fleet-health-report
namespace: bcm.node-ops
description: |
  Batch status check across all nodes in inventory.
  Runs node-status.sh for each node and outputs a summary.

inputs:
  - id: reason
    type: STRING
    defaults: "scheduled-health-report"

tasks:
  - id: log-start
    type: io.kestra.plugin.core.log.Log
    message: "[FLEET-HEALTH] Starting fleet health report"

  - id: health-report
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    env:
      NODE_INVENTORY_PATH: /opt/bcm-node-ops/config/nodes.yaml
      AUDIT_LOG_DIR: /var/log/bcm-node-ops
      REDFISH_USER: "{{ secret('REDFISH_USER') }}"
      REDFISH_PASSWORD: "{{ secret('REDFISH_PASSWORD') }}"
    commands:
      - |
        echo '{"report":"fleet-health","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","nodes":['
        FIRST=true
        # Parse node names from inventory
        grep -E '^\s{2}[a-zA-Z0-9]' /opt/bcm-node-ops/config/nodes.yaml | sed 's/://g' | awk '{print $1}' | while read -r NODE; do
          if [ "$FIRST" = true ]; then FIRST=false; else echo ','; fi
          /opt/bcm-node-ops/scripts/node-status.sh "$NODE" "{{ inputs.reason }}" 2>/dev/null || echo "{\"node\":\"${NODE}\",\"bcm_status\":\"ERROR\"}"
        done
        echo ']}'

errors:
  - id: on-failure
    type: io.kestra.plugin.core.log.Log
    message: "[FAILED] Fleet health report failed: {{ error.message }}"
