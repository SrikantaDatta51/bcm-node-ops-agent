id: node-status
namespace: bcm.node-ops
description: |
  Check node status via BCM cmsh.
  Returns structured JSON with BCM status, power state, and reachability.

inputs:
  - id: node_name
    type: STRING
    description: "Target node (e.g. dgx-b200-017)"
    required: true
  - id: reason
    type: STRING
    defaults: "manual-status-check"

tasks:
  - id: log-start
    type: io.kestra.plugin.core.log.Log
    message: "[NODE-STATUS] node={{ inputs.node_name }} reason={{ inputs.reason }}"

  - id: check-status
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    env:
      NODE_INVENTORY_PATH: /opt/bcm-node-ops/config/nodes.yaml
      AUDIT_LOG_DIR: /var/log/bcm-node-ops
      REDFISH_USER: "{{ secret('REDFISH_USER') }}"
      REDFISH_PASSWORD: "{{ secret('REDFISH_PASSWORD') }}"
    commands:
      - /opt/bcm-node-ops/scripts/node-status.sh "{{ inputs.node_name }}" "{{ inputs.reason }}"

errors:
  - id: on-failure
    type: io.kestra.plugin.core.log.Log
    message: "[FAILED] Status check failed for {{ inputs.node_name }}: {{ error.message }}"
