id: node-reboot
namespace: bcm.node-ops
description: |
  Reboot a GPU or CPU node via Redfish BMC.
  Supports graceful (OS shutdown) and force (immediate) modes.
  Always validates against node inventory and emits audit logs.

inputs:
  - id: node_name
    type: STRING
    description: "Target node (e.g. dgx-b200-017, cpu-r660-004)"
    required: true
  - id: mode
    type: STRING
    description: "graceful = OS shutdown first, force = immediate restart"
    defaults: "graceful"
    allowedValues: ["graceful", "force"]
  - id: reason
    type: STRING
    description: "Reason for reboot (logged in audit trail)"
    defaults: "manual-reboot"
  - id: dry_run
    type: BOOLEAN
    description: "If true, validate only — do not execute"
    defaults: true

tasks:
  - id: log-start
    type: io.kestra.plugin.core.log.Log
    message: |
      [NODE-REBOOT] node={{ inputs.node_name }} mode={{ inputs.mode }} reason={{ inputs.reason }} dry_run={{ inputs.dry_run }}

  - id: dry-run-check
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.dry_run }}"
    then:
      - id: dry-run-log
        type: io.kestra.plugin.core.log.Log
        message: |
          [DRY RUN] Would reboot {{ inputs.node_name }} with Redfish {{ inputs.mode == 'force' ? 'ForceRestart' : 'GracefulRestart' }}
    else:
      - id: execute-reboot
        type: io.kestra.plugin.scripts.shell.Commands
        runner: PROCESS
        env:
          REDFISH_USER: "{{ secret('REDFISH_USER') }}"
          REDFISH_PASSWORD: "{{ secret('REDFISH_PASSWORD') }}"
          REDFISH_TLS_VERIFY: "{{ vars.redfish_tls_verify ?? 'false' }}"
          NODE_INVENTORY_PATH: /opt/bcm-node-ops/config/nodes.yaml
          AUDIT_LOG_DIR: /var/log/bcm-node-ops
        commands:
          - /opt/bcm-node-ops/scripts/redfish-reboot.sh "{{ inputs.node_name }}" "{{ inputs.mode }}" "{{ inputs.reason }}"

  - id: post-status
    type: io.kestra.plugin.core.flow.If
    condition: "{{ !inputs.dry_run }}"
    then:
      - id: check-status
        type: io.kestra.plugin.scripts.shell.Commands
        runner: PROCESS
        env:
          NODE_INVENTORY_PATH: /opt/bcm-node-ops/config/nodes.yaml
          AUDIT_LOG_DIR: /var/log/bcm-node-ops
          REDFISH_USER: "{{ secret('REDFISH_USER') }}"
          REDFISH_PASSWORD: "{{ secret('REDFISH_PASSWORD') }}"
        commands:
          - sleep 10
          - /opt/bcm-node-ops/scripts/node-status.sh "{{ inputs.node_name }}" "post-reboot-check"

errors:
  - id: on-failure
    type: io.kestra.plugin.core.log.Log
    message: "[FAILED] Reboot failed for {{ inputs.node_name }}: {{ error.message }}"
