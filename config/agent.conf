# ── SQS / SNS ──────────────────────────────────────────────
# Replace with your real endpoints when connectivity is established.
SQS_QUEUE_URL="https://sqs.us-east-1.amazonaws.com/123456789012/bcm-node-ops-requests"
SNS_TOPIC_ARN="arn:aws:sns:us-east-1:123456789012:bcm-node-ops-results"
AWS_REGION="us-east-1"

# ── Polling ────────────────────────────────────────────────
POLL_INTERVAL_SECONDS=10
SQS_WAIT_TIME_SECONDS=20
SQS_MAX_MESSAGES=1

# ── Redfish BMC Credentials ───────────────────────────────
# Per-vendor credentials (GPU and CPU nodes have different BMC logins)
# The agent resolves credentials in this order:
#   1. Vendor-specific: REDFISH_USER_DGX / REDFISH_PASSWORD_DGX
#   2. Fallback global: REDFISH_USER / REDFISH_PASSWORD

# GPU nodes — NVIDIA DGX (AMI BMC)
REDFISH_USER_DGX=coupangdgx
REDFISH_PASSWORD_DGX=changeme-dgx

# CPU nodes — Dell iDRAC
REDFISH_USER_IDRAC=root
REDFISH_PASSWORD_IDRAC=changeme-idrac

# CPU nodes — HPE iLO (if applicable)
REDFISH_USER_ILO=pang
REDFISH_PASSWORD_ILO=changeme-ilo

# Global fallback (used if vendor-specific vars are not set)
REDFISH_USER=admin
REDFISH_PASSWORD=changeme

REDFISH_TLS_VERIFY=false
REDFISH_TIMEOUT=30

# ── Paths ─────────────────────────────────────────────────
INSTALL_DIR=/opt/bcm-node-ops
LOG_DIR=/var/log/bcm-node-ops
AUDIT_LOG=/var/log/bcm-node-ops/audit.jsonl
NODE_INVENTORY=/opt/bcm-node-ops/config/nodes.yaml
